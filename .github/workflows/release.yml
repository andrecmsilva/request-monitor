name: Build and publish plugin release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ \* Version: \([0-9][0-9.]*\).*/\1/p' rocket-request-tracer.php | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine plugin version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this push is a release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$COMMIT_MESSAGE" = "Release $TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit. Expected: Release $TAG"
          fi

      - name: Build WordPress-installable ZIP
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/request-monitor/includes build/request-monitor/mu dist

          cp rocket-request-tracer.php build/request-monitor/
          cp -R includes/. build/request-monitor/includes/
          cp -R mu/. build/request-monitor/mu/

          for file in README.md CHANGELOG.md SECURITY.md; do
            if [ -f "$file" ]; then
              cp "$file" build/request-monitor/
            fi
          done

          cd build
          zip -qr "../dist/request-monitor-v${VERSION}.zip" request-monitor
          cd ..

          unzip -l "dist/request-monitor-v${VERSION}.zip"

      - name: Create GitHub release and upload ZIP
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<EOF
          ## Request Monitor v${VERSION}

          Experimental production diagnostics for WordPress/PHP worker saturation.

          This release includes the mandatory MU tracing foundation, automatic slow-request escalation, hook/callback timing, SQL and outbound HTTP attribution, request/query fingerprint grouping, configurable trace scopes, and WP-CLI control.

          ### Install with WP-CLI

          \`\`\`bash
          wp plugin install "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/request-monitor-v${VERSION}.zip" --activate
          \`\`\`

          After activation:

          \`\`\`bash
          wp request-monitor status
          wp request-monitor enable --slow-ms=1500
          \`\`\`
          EOF

          gh release create "$TAG" \
            "dist/request-monitor-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Request Monitor v${VERSION}" \
            --notes-file /tmp/release-notes.md
